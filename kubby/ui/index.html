<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kubby</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🐾</span>
      <h1>kubby</h1>
      <span class="tagline">local kubernetes</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="cluster" type="button">Cluster</button>
      <button class="tab" data-tab="search" type="button">Search</button>
      <button class="tab" data-tab="docs" type="button">Docs</button>
    </nav>

    <button class="ghost" id="refresh" type="button">Re-check</button>
  </header>

  <main>
    <!-- Cluster tab -->
    <section class="tab-panel" id="tab-cluster" aria-live="polite">
      <div id="cluster-content"></div>
    </section>

    <!-- Search tab (image search) -->
    <section class="tab-panel" id="tab-search" hidden>
      <div class="search-bar-row">
        <div class="search-input-wrap">
          <label for="search-input" class="sr-only">Search container images</label>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search container images…"
            autocomplete="off"
          />
        </div>
        <label for="tag-filter" class="sr-only">Filter by tag</label>
        <input
          type="text"
          id="tag-filter"
          class="tag-filter"
          placeholder="Tag filter (optional)"
          autocomplete="off"
        />
        <a
          id="dockerhub-link"
          class="dockerhub-link"
          href="https://hub.docker.com/search"
          target="_blank"
          rel="noopener noreferrer"
          title="Search on Docker Hub"
        >
          <span aria-hidden="true">🐳</span>
          <span>Docker Hub</span>
        </a>
      </div>
      <div id="search-empty" class="search-empty">
        <span class="search-empty-icon">📦</span>
        <p>Search GitHub Container Registry or browse local podman images</p>
      </div>
      <section class="cards" id="search-results"></section>
      <div id="search-status" class="search-status" hidden role="status" aria-live="polite"></div>
      <button type="button" class="ghost" id="load-more" hidden>Load More</button>
    </section>

    <!-- Docs tab (tool status) -->
    <section class="tab-panel" id="tab-docs" hidden>
      <div class="docs-toolbar">
        <button type="button" class="primary" id="install-all" hidden>Install All</button>
      </div>
      <section class="cards" id="cards" aria-live="polite"></section>
    </section>
  </main>

  <!-- Global log panel. Mounted statically in the body so it survives
       tab switches and card re-renders. The cluster tab (minikube
       start/stop/delete) and the docs tab (per-tool install) both
       stream into this single panel via window.kubby.appendLog. -->
  <div class="log-panel global-log" id="global-log" hidden>
    <div class="log-header">
      <h2 id="global-log-title">output</h2>
      <span class="log-hint" id="global-log-hint">streaming…</span>
    </div>
    <pre class="log" id="global-log-content"></pre>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
