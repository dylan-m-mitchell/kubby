[project]
name = "kubby"
version = "0.1.0"
description = "GUI tool for managing local Kubernetes cluster resources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
    "textual>=8.2.8",
]

[project.scripts]
kubby = "kubby.app:main"

[tool.uv]
# The shipped artifact is a PyInstaller --onefile binary
# (see build-binary.sh); uv is the dev install path only.
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
