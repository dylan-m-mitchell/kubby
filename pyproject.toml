[project]
name = "kubby"
version = "0.1.0"
description = "GUI tool for managing local Kubernetes cluster resources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
]

[tool.uv]
# Treat this project as an application, not a library — uv won't
# try to build a wheel from it. The shipped artifact is a
# PyInstaller --onefile binary (see build-binary.sh); uv is the
# dev install path only.
#
# Dev workflow note: with no [project.scripts] entry, `uv run kubby`
# is no longer registered. Use `uv run -m kubby.app` (or
# `uv run python kubby/__main__.py`) to launch from source.
package = false
