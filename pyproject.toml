[project]
name = "kubby"
version = "0.1.0"
description = "GUI tool for managing local Kubernetes cluster resources."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
]

[project.scripts]
kubby = "kubby.app:main"

[tool.uv]
# The shipped artifact is a PyInstaller --onefile binary
# (see build-binary.sh); uv is the dev install path only.
package = true
